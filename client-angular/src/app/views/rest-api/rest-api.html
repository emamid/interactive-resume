<div class="rest-api">
  <h2>REST API</h2>
  <div class="controls" [class.controls-no-id]="!allowsId(endpoint())">
    <div class="control-field endpoint-field">
      <ion-select
        label="Endpoint"
        labelPlacement="stacked"
        fill="outline"
        interface="popover"
        [value]="endpoint()"
        (ionChange)="setEndpoint($event.detail.value)"
      >
        @for (item of endpointItems; track item) {
          <ion-select-option [value]="item">{{ item }}</ion-select-option>
        }
      </ion-select>
    </div>
    @if (allowsId(endpoint())) {
      <div class="control-field id-field">
        <ion-input
          label="id"
          labelPlacement="stacked"
          fill="outline"
          [value]="id()"
          [helperText]="hint()"
          [clearInput]="true"
          (ionInput)="setId($event.detail.value)"
        />
      </div>
    }
  </div>
  <ion-button class="request-button" (click)="makeRequest()">Request</ion-button>
  @if (data()) {
    <h2 class="response-caption">Response data for {{ lastURL() }}:</h2>
    <app-json-viewer
      [data]="data()"
      [allowsId]="allowsId(lastEndpoint())"
      (itemClicked)="itemClicked($event)"
    />
  }
  @if (statusMessage()) {
    <pre>{{ statusMessage() }}</pre>
  }
</div>
